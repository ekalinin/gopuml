id: output-formats/txt-class-unsupported
scenarios:
  - "output-formats: TXT for a class diagram"
package: "."
test: TestRenderClassDiagramAsTXTIsUnsupported
why: Upstream v1.2026.8 renders a class diagram as TXT (rough ASCII boxes, exit 0, a .atxt file), while the spec requires an unsupported-format error and no output file.
