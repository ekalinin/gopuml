id: preprocessor/sandbox-blocks-local-include
scenarios:
  - "preprocessor: Sandbox blocks local files"
args: ["--svg", "main.puml"]
files:
  main.puml: |
    @startuml
    Alice -> Bob : hi
    !include common.iuml
    @enduml
  common.iuml: |
    Bob -> Carol : included
env:
  PLANTUML_SECURITY_PROFILE: SANDBOX
compare: [exit, files, stderr]
