name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache upstream sources
        uses: actions/cache@v4
        with:
          path: .cache/upstream
          key: upstream-${{ hashFiles('tools/upstream/checksums.sha256') }}

      - name: Fetch upstream sources
        run: tools/upstream/fetch.sh

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Provenance
        run: make provenance

      - name: WASM build
        run: make wasm
